name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, types, unit, build, e2e (demo, без секретов)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_DATA_MODE: demo
      SPORTS_PROVIDER: fixtures
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  # Политика аудита зависимостей не согласована (docs/requirements.md §18.4), поэтому пока информационный шаг.
  audit:
    name: Dependency audit (информационно)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm audit --omit=dev --audit-level=high

  # Миграции с нуля, pgTAP и интеграционные тесты на локальном Supabase (docs/requirements.md §18.4, шаг 6).
  database:
    name: Supabase local — миграции, pgTAP, интеграция, e2e connected
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx supabase start
      - run: npx supabase db reset
      - run: npx supabase test db
      - run: npm run test:integration
      # Полный путь пользователя на локальном Supabase (docs/testing-strategy.md, п. 1).
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e:connected
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-connected
          path: playwright-report
          retention-days: 7
      - run: npx supabase stop
        if: always()
